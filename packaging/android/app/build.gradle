plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "ai.storyteller.photocraft"
    compileSdk 35

    defaultConfig {
        applicationId "ai.storyteller.photocraft"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.23.1"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // A debug key is enough to sideload. Play signing is a later step.
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

configurations.configureEach {
    // kotlin-stdlib 1.8 absorbed the jdk7/jdk8 artifacts. GameActivity still pulls the old jars.
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

dependencies {
    implementation "androidx.games:games-activity:4.4.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.documentfile:documentfile:1.0.1"
}
